version: "2"
run:
  concurrency: 4
  timeout: 2m
  issues-exit-code: 1
  modules-download-mode: mod
  tests: true

# Т2 TECH_DEBT: базовый набор линтеров, включается постепенно (31.08 → …).
# Порядок доработки: сначала прогон с текущим набором и починка, затем
# добавление следующих (gocyclo, goconst, dupl, whitespace, revive).
linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unconvert
    - unparam
    - gocritic
  settings:
    gocritic:
      # commentFormatting отключён: в кодовой базе ~230 строк комментированного кода
      # в стиле `//code` (блоки выключенной логики). Проверка даёт шум без ценности;
      # вернуть при чистке мёртвого кода (Т5).
      disabled-checks:
        - commentFormatting

